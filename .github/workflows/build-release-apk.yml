name: Build release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name, e.g. 1.0.13'
        required: true
      build_number:
        description: 'Build number; must be higher than the last build installed (1.0.12 = 13)'
        required: true
      target:
        description: 'Backend the app points to'
        type: choice
        options:
          - gcp
          - nic
        default: gcp

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Pinned to the version the team builds and tests with. Newer stable
      # releases need Gradle 9.3.1+, but android/ uses Gradle 9.1.0.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - name: Check inputs
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must look like 1.0.13"; exit 1; }
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || { echo "build_number must be a number"; exit 1; }
          if [ "$TARGET" = "nic" ]; then
            echo "GATEWAY=https://aeroindia.gov.in/api" >> "$GITHUB_ENV"
            echo "NAME=liaison-officer-$VERSION-nic" >> "$GITHUB_ENV"
          else
            echo "GATEWAY=https://aeroindia.evenuefy.com/api" >> "$GITHUB_ENV"
            echo "NAME=liaison-officer-$VERSION" >> "$GITHUB_ENV"
          fi

      # TEMPORARY: a new throwaway key each run, so a CI APK cannot update an
      # APK signed with another key (uninstall first). Replace with the real
      # release keystore from repository secrets (VAPT LOA-01).
      - name: Create testing upload keystore
        working-directory: android
        run: |
          keytool -genkey -v \
            -keystore upload-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload \
            -storepass ciTestOnly \
            -keypass ciTestOnly \
            -dname "CN=LO CI, OU=CAP, O=BEL, L=Bengaluru, ST=Karnataka, C=IN"
          printf '%s\n' \
            'storePassword=ciTestOnly' \
            'keyPassword=ciTestOnly' \
            'keyAlias=upload' \
            'storeFile=upload-keystore.jks' \
            > key.properties

      # HTTPS gateway only: the app no longer allows cleartext HTTP (VAPT
      # LOA-02). Dart code is obfuscated (VAPT HIGH-05); the symbol files
      # in build/symbols are needed to read crash stack traces.
      - name: Build release APK
        run: |
          flutter pub get
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUMBER" \
            --obfuscate \
            --split-debug-info=build/symbols \
            --dart-define=USE_MOCK_API=false \
            --dart-define=API_GATEWAY_URL="$GATEWAY" \
            --dart-define=ENABLE_FCM=true

      - name: Stage APK under releases/
        run: |
          mkdir -p releases
          cp build/app/outputs/flutter-apk/app-release.apk "releases/$NAME.apk"
          ls -lh "releases/$NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}-apk
          path: releases/${{ env.NAME }}.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}-symbols
          path: build/symbols
          if-no-files-found: error
