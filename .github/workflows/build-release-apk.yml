name: Build release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name, e.g. 1.0.13'
        required: true
      build_number:
        description: 'Build number; must be higher than the last build installed (1.0.12 = 13)'
        required: true
      target:
        description: 'Backend the app points to'
        type: choice
        options:
          - gcp
          - nic
        default: gcp

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Pinned to the version the team builds and tests with. Newer stable
      # releases need Gradle 9.3.1+, but android/ uses Gradle 9.1.0.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - name: Check inputs
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must look like 1.0.13"; exit 1; }
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || { echo "build_number must be a number"; exit 1; }
          if [ "$TARGET" = "nic" ]; then
            echo "GATEWAY=https://aeroindia.gov.in/api" >> "$GITHUB_ENV"
            echo "NAME=liaison-officer-$VERSION-nic" >> "$GITHUB_ENV"
          else
            echo "GATEWAY=https://aeroindia.evenuefy.com/api" >> "$GITHUB_ENV"
            echo "NAME=liaison-officer-$VERSION" >> "$GITHUB_ENV"
          fi

      # Release keystore from repository secrets (VAPT LOA-01). Every build
      # is signed with the same key, so new builds update over old ones.
      - name: Restore release keystore
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Release keystore secrets are missing (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=release.jks"
          } > key.properties

      # HTTPS gateway only: the app no longer allows cleartext HTTP (VAPT
      # LOA-02). Dart code is obfuscated (VAPT HIGH-05); the symbol files
      # in build/symbols are needed to read crash stack traces.
      - name: Build release APK
        run: |
          flutter pub get
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUMBER" \
            --obfuscate \
            --split-debug-info=build/symbols \
            --dart-define=USE_MOCK_API=false \
            --dart-define=API_GATEWAY_URL="$GATEWAY" \
            --dart-define=ENABLE_FCM=true

      - name: Stage APK under releases/
        run: |
          mkdir -p releases
          cp build/app/outputs/flutter-apk/app-release.apk "releases/$NAME.apk"
          ls -lh "releases/$NAME.apk"
          rm -f android/release.jks android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}-apk
          path: releases/${{ env.NAME }}.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}-symbols
          path: build/symbols
          if-no-files-found: error
