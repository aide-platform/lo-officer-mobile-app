name: liaison_officer
description: "Liaison Officer mobile app for bel.com"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  url_launcher: ^6.3.1
  qr_flutter: ^4.1.0
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.3
  dio: ^5.8.0+1
  image_picker: ^1.1.2
  file_picker: ^10.3.2
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  pdf: ^3.11.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: assets/images/aero-india-logo.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/images/aero-india-logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/
